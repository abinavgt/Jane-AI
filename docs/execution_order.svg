<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Ink Free', 'Segoe Print', 'Caveat', 'Comic Sans MS', cursive, sans-serif;">
  <style>
    .sketch-box { fill: #fcfcfc; stroke: #222222; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .sketch-card { fill: #ffffff; stroke: #1e1e1e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .title-text { fill: #111111; font-size: 24px; font-weight: bold; }
    .header-text { fill: #181818; font-size: 17px; font-weight: bold; }
    .body-dim { fill: #666666; font-size: 13px; }
    .badge-text { fill: #444444; font-size: 12px; font-weight: bold; }
  </style>

  <!-- Top Banner -->
  <g id="header">
    <rect x="30" y="20" width="1540" height="65" rx="8" class="sketch-box" />
    <path d="M 32 22 L 1568 19 L 1571 86 L 29 88 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="50" y="58" class="title-text">Jane AI — High-Level Sequential Execution Order</text>
  </g>

  <!-- Step 1 -->
