    <path d="M 1107 127 L 1278 124 L 1281 283 L 1104 286 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <rect x="1120" y="141" width="75" height="28" rx="4" fill="#f4f4f5" stroke="#222" stroke-width="1" />
    <text x="1131" y="160" class="badge-text">STEP 6</text>
    <text x="1120" y="205" class="header-text">TTS Synthesis</text>
