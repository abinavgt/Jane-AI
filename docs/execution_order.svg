  <!-- Bottom Note -->
  <text x="50" y="325" class="body-dim">Order of execution: 1. Audio Input ➔ 2. STT ➔ 3. Semantic RAG ➔ 4. LLM ➔ 5. Tool Calling ➔ 6. TTS ➔ 7. Database</text>
