  <g id="arrows" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 1 -> 3 -->
    <path d="M 360 290 Q 380 290 398 290 M 390 284 L 398 290 L 390 296" />
    <!-- 1 -> 2 -->
    <path d="M 200 445 Q 200 457 200 468 M 194 460 L 200 468 L 206 460" />
    <!-- 2 -> 4 -->
    <path d="M 360 595 Q 380 595 398 595 M 390 589 L 398 595 L 390 601" />
    <!-- 3 -> 4 -->
    <path d="M 605 445 Q 605 457 605 468 M 599 460 L 605 468 L 611 460" />
    <!-- 4 -> 6 -->
    <path d="M 810 595 Q 830 595 848 595 M 840 589 L 848 595 L 840 601" />
    <!-- 4 -> 5 -->
    <path d="M 680 470 Q 750 360 848 290 M 840 285 L 848 290 L 843 297" />
    <!-- 5 -> 7 -->
    <path d="M 1190 290 Q 1210 290 1228 290 M 1220 284 L 1228 290 L 1220 296" />
    <!-- 6 -> 7 -->
    <path d="M 1190 595 Q 1210 595 1228 595 M 1220 589 L 1228 595 L 1220 601" />
  </g>

  <!-- Bottom Turn Sequence Chain -->
  <g id="bottom-chain">
    <rect x="40" y="750" width="1520" height="175" rx="8" class="sketch-box" />
    <path d="M 42 752 L 1558 748 L 1561 922 L 39 926 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="65" y="780" class="header-text">Turn Sequence (Browser Voice Interaction):</text>

    <!-- Step 1 -->
    <rect x="65" y="805" width="225" height="95" rx="6" class="sketch-card" />
    <text x="80" y="828" class="badge-text" fill="#666">STEP 1</text>
    <text x="80" y="852" class="header-text" font-size="16">Mic Audio Input</text>
    <text x="80" y="880" class="body-dim">Web Audio PCM WAV</text>
    <path d="M 295 852 L 310 852 M 304 847 L 310 852 L 304 857" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Step 2 -->
    <rect x="315" y="805" width="225" height="95" rx="6" class="sketch-card" />
    <text x="330" y="828" class="badge-text" fill="#666">STEP 2</text>
    <text x="330" y="852" class="header-text" font-size="16">STT Transcription</text>
    <text x="330" y="880" class="body-dim">SpeechRecog / Sarvam</text>
    <path d="M 545 852 L 560 852 M 554 847 L 560 852 L 554 857" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Step 3 -->
    <rect x="565" y="805" width="225" height="95" rx="6" class="sketch-card" />
    <text x="580" y="828" class="badge-text" fill="#666">STEP 3</text>
    <text x="580" y="852" class="header-text" font-size="16">RAG Retrieval</text>
    <text x="580" y="880" class="body-dim">InstantCourseRetriever (0ms)</text>
    <path d="M 795 852 L 810 852 M 804 847 L 810 852 L 804 857" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Step 4 -->
    <rect x="815" y="805" width="225" height="95" rx="6" class="sketch-card" />
    <text x="830" y="828" class="badge-text" fill="#666">STEP 4</text>
    <text x="830" y="852" class="header-text" font-size="16">LLM Reasoning</text>
    <text x="830" y="880" class="body-dim">Groq / Gemini / Fallback</text>
    <path d="M 1045 852 L 1060 852 M 1054 847 L 1060 852 L 1054 857" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Step 5 -->
    <rect x="1065" y="805" width="225" height="95" rx="6" class="sketch-card" />
    <text x="1080" y="828" class="badge-text" fill="#666">STEP 5</text>
    <text x="1080" y="852" class="header-text" font-size="16">Tool Call &amp; Action</text>
    <text x="1080" y="880" class="body-dim">Auto Demo Booking &amp; Score</text>
    <path d="M 1295 852 L 1310 852 M 1304 847 L 1310 852 L 1304 857" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Step 6 -->
    <rect x="1315" y="805" width="225" height="95" rx="6" class="sketch-card" />
    <text x="1330" y="828" class="badge-text" fill="#666">STEP 6</text>
    <text x="1330" y="852" class="header-text" font-size="16">TTS Voice Out</text>
    <text x="1330" y="880" class="body-dim">Sarvam / Web Audio Speech</text>
