  <g filter="url(#shadow)">
    <rect x="40" y="760" width="1520" height="155" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <text x="65" y="792" fill="#EBF981" font-size="16" font-weight="bold">End-to-End Turn Sequence Workflow:</text>

    <!-- Step 1 -->
    <rect x="65" y="812" width="220" height="82" rx="8" fill="#18243e" stroke="#3b82f6" stroke-width="1.2" />
    <text x="77" y="830" fill="#60a5fa" font-size="11" font-weight="bold">STEP 1</text>
    <text x="77" y="852" fill="#f1f5f9" font-size="15" font-weight="bold">Mic Audio Upload</text>
    <text x="77" y="876" fill="#94a3b8" font-size="12">Web Audio PCM Stream</text>
    <path d="M 292 853 L 306 853 M 302 849 L 306 853 L 302 857" stroke="#EBF981" stroke-width="2" fill="none" />

    <!-- Step 2 -->
    <rect x="315" y="812" width="220" height="82" rx="8" fill="#18243e" stroke="#10b981" stroke-width="1.2" />
    <text x="327" y="830" fill="#34d399" font-size="11" font-weight="bold">STEP 2</text>
    <text x="327" y="852" fill="#f1f5f9" font-size="15" font-weight="bold">STT Transcription</text>
    <text x="327" y="876" fill="#94a3b8" font-size="12">SpeechRecog / Sarvam</text>
    <path d="M 542 853 L 556 853 M 552 849 L 556 853 L 552 857" stroke="#EBF981" stroke-width="2" fill="none" />

    <!-- Step 3 -->
    <rect x="565" y="812" width="220" height="82" rx="8" fill="#18243e" stroke="#f59e0b" stroke-width="1.2" />
    <text x="577" y="830" fill="#fbbf24" font-size="11" font-weight="bold">STEP 3</text>
    <text x="577" y="852" fill="#f1f5f9" font-size="15" font-weight="bold">RAG Retrieval (0ms)</text>
    <text x="577" y="876" fill="#94a3b8" font-size="12">InstantCourseRetriever</text>
    <path d="M 792 853 L 806 853 M 802 849 L 806 853 L 802 857" stroke="#EBF981" stroke-width="2" fill="none" />

    <!-- Step 4 -->
    <rect x="815" y="812" width="220" height="82" rx="8" fill="#18243e" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="827" y="830" fill="#a78bfa" font-size="11" font-weight="bold">STEP 4</text>
    <text x="827" y="852" fill="#f1f5f9" font-size="15" font-weight="bold">Dual LLM Reasoning</text>
    <text x="827" y="876" fill="#94a3b8" font-size="12">Groq / Gemini / Offline</text>
    <path d="M 1042 853 L 1056 853 M 1052 849 L 1056 853 L 1052 857" stroke="#EBF981" stroke-width="2" fill="none" />

    <!-- Step 5 -->
    <rect x="1065" y="812" width="220" height="82" rx="8" fill="#18243e" stroke="#ec4899" stroke-width="1.2" />
    <text x="1077" y="830" fill="#f472b6" font-size="11" font-weight="bold">STEP 5</text>
    <text x="1077" y="852" fill="#f1f5f9" font-size="15" font-weight="bold">Tool Call &amp; Action</text>
    <text x="1077" y="876" fill="#94a3b8" font-size="12">Demo Booking &amp; Scoring</text>
    <path d="M 1292 853 L 1306 853 M 1302 849 L 1306 853 L 1302 857" stroke="#EBF981" stroke-width="2" fill="none" />

    <!-- Step 6 -->
    <rect x="1315" y="812" width="220" height="82" rx="8" fill="#18243e" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="1327" y="830" fill="#38bdf8" font-size="11" font-weight="bold">STEP 6</text>
    <text x="1327" y="852" fill="#f1f5f9" font-size="15" font-weight="bold">TTS Voice Playback</text>
    <text x="1327" y="876" fill="#94a3b8" font-size="12">Browser Audio Synthesis</text>
  </g>
</svg>
