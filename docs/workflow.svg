<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Ink Free', 'Segoe Print', 'Caveat', 'Comic Sans MS', cursive, sans-serif;">
  <style>
    .sketch-box { fill: #fcfcfc; stroke: #222222; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .sketch-card { fill: #ffffff; stroke: #1e1e1e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .sketch-line { stroke: #2a2a2a; stroke-width: 2; stroke-linecap: round; }
    .sketch-sub { stroke: #888888; stroke-width: 1.2; stroke-dasharray: 4,4; }
    .title-text { fill: #111111; font-size: 28px; font-weight: bold; }
    .header-text { fill: #181818; font-size: 19px; font-weight: bold; }
    .body-bold { fill: #111111; font-size: 15px; font-weight: 600; }
    .body-dim { fill: #555555; font-size: 13px; }
    .badge-text { fill: #333333; font-size: 12px; font-weight: bold; }
  </style>

  <!-- Outer Canvas Sketch Border -->
  <rect x="15" y="15" width="1570" height="930" rx="4" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Top Banner -->
  <g id="header">
    <rect x="40" y="25" width="1520" height="85" rx="8" class="sketch-box" />
    <path d="M 42 27 L 1558 24 L 1560 108 L 38 111 Z" fill="none" stroke="#333333" stroke-width="1" opacity="0.4" />
    <text x="65" y="62" class="title-text">Jane AI — System Architecture &amp; Workflow Pipeline</text>
    <text x="65" y="94" class="body-dim">Hand-drawn Excalidraw Schema: Browser Mic • STT • Semantic RAG (0ms) • Dual LLM • Autonomous Tool Calling • Database • TTS</text>
  </g>

  <!-- 1. Candidate Input -->
  <g id="box-1">
    <rect x="40" y="135" width="320" height="310" rx="8" class="sketch-card" />
    <path d="M 42 137 L 358 134 L 361 444 L 39 446 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="58" y="168" class="header-text">[1] Candidate Input &amp; Mic</text>
    <line x1="55" y1="180" x2="345" y2="180" stroke="#888888" stroke-width="1.2" stroke-linecap="round" />
    
    <text x="58" y="210" class="body-bold">• Browser Mic Audio (PCM 16-bit WAV)</text>
    <text x="70" y="230" class="body-dim">Web Audio API direct microphone stream</text>
    <text x="58" y="260" class="body-bold">• Instant Question Stack</text>
    <text x="70" y="280" class="body-dim">Fees, 0% EMI, GPU Labs, syllabus</text>
    <text x="58" y="310" class="body-bold">• Languages Supported:</text>
    <text x="70" y="330" class="body-bold" fill="#000000">English (en-IN), Hindi (hi-IN), Tamil (ta-IN)</text>
    <text x="58" y="365" class="body-bold">• Caller Cockpit &amp; Live Dialer</text>
    <text x="70" y="385" class="body-dim">1-click phone copy &amp; call recording</text>
  </g>

  <!-- 2. STT Engine -->
  <g id="box-2">
    <rect x="40" y="470" width="320" height="250" rx="8" class="sketch-card" />
    <path d="M 42 472 L 358 468 L 361 718 L 39 721 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="58" y="503" class="header-text">[2] Speech-to-Text (STT)</text>
    <line x1="55" y1="515" x2="345" y2="515" stroke="#888888" stroke-width="1.2" stroke-linecap="round" />
    
    <text x="58" y="545" class="body-bold">• Python SpeechRecognition</text>
    <text x="70" y="565" class="body-dim">Fast local WAV transcription</text>
    <text x="58" y="595" class="body-bold">• Sarvam AI Indian Speech API</text>
    <text x="70" y="615" class="body-dim">Acoustic models for Hindi &amp; Tamil</text>
    <text x="58" y="645" class="body-bold">• Multi-turn Session Manager</text>
    <text x="70" y="665" class="body-dim">UUID session state &amp; candidate tracking</text>
  </g>

  <!-- 3. Semantic RAG Knowledge Base -->
  <g id="box-3">
    <rect x="400" y="135" width="410" height="310" rx="8" class="sketch-card" />
    <path d="M 402 137 L 808 134 L 811 444 L 399 446 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="418" y="168" class="header-text">[3] Semantic RAG (0ms Latency)</text>
    <line x1="415" y1="180" x2="795" y2="180" stroke="#888888" stroke-width="1.2" stroke-linecap="round" />
    
    <text x="418" y="210" class="body-bold">• InstantCourseRetriever (0 ms)</text>
    <text x="430" y="230" class="body-dim">Pure Python keyword engine, zero network lag</text>
    <text x="418" y="260" class="body-bold">• ai_courses_catalog.txt</text>
    <text x="430" y="280" class="body-dim">AI/ML, GenAI, MLOps, syllabus, 0% EMI</text>
    <text x="418" y="310" class="body-bold">• course_objections_faq.txt</text>
    <text x="430" y="330" class="body-dim">Non-coding background, placement guarantee</text>
    <text x="418" y="360" class="body-bold">• Dynamic Prompt Injection</text>
    <text x="430" y="380" class="body-dim">Injects factual curriculum chunks into LLM</text>
  </g>

  <!-- 4. Dual LLM Engine -->
  <g id="box-4">
    <rect x="400" y="470" width="410" height="250" rx="8" class="sketch-card" />
    <path d="M 402 472 L 808 468 L 811 718 L 399 721 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="418" y="503" class="header-text">[4] Dual LLM Reasoning Engine</text>
    <line x1="415" y1="515" x2="795" y2="515" stroke="#888888" stroke-width="1.2" stroke-linecap="round" />
    
    <text x="418" y="545" class="body-bold">• Primary: Groq Llama 3.3 70B</text>
    <text x="430" y="565" class="body-dim">Ultra-fast real-time speech token generation</text>
    <text x="418" y="595" class="body-bold">• Secondary: Google Gemini 1.5 Flash</text>
    <text x="430" y="615" class="body-dim">High-context multimodal fallback</text>
    <text x="418" y="645" class="body-bold">• Offline Domain Counselor Fallback</text>
    <text x="430" y="665" class="body-dim">Guaranteed responses even without API keys</text>
  </g>

  <!-- 5. Tool Calling & Actions -->
  <g id="box-5">
    <rect x="850" y="135" width="340" height="310" rx="8" class="sketch-card" />
    <path d="M 852 137 L 1188 134 L 1191 444 L 849 446 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="868" y="168" class="header-text">[5] Tool Calling &amp; Actions</text>
    <line x1="865" y1="180" x2="1175" y2="180" stroke="#888888" stroke-width="1.2" stroke-linecap="round" />
    
    <text x="868" y="210" class="body-bold">• Tool 1: 1-on-1 Demo Booking</text>
    <text x="880" y="230" class="body-dim">Auto-locks demo slot with senior mentors</text>
    <text x="868" y="260" class="body-bold">• Tool 2: Qualification Scoring</text>
    <text x="880" y="280" class="body-dim">0 to 100 rating on intent, timeline &amp; budget</text>
    <text x="868" y="310" class="body-bold">• Tool 3: Sentiment Tracking</text>
    <text x="880" y="330" class="body-dim">Positive / Hesitant / Skeptical sentiment</text>
    <text x="868" y="360" class="body-bold">• Tool 4: WhatsApp CRM Dispatch</text>
    <text x="880" y="380" class="body-dim">Auto-triggers brochure &amp; RM escalation</text>
  </g>

  <!-- 6. TTS Voice Engine -->
  <g id="box-6">
    <rect x="850" y="470" width="340" height="250" rx="8" class="sketch-card" />
    <path d="M 852 472 L 1188 468 L 1191 718 L 849 721 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="868" y="503" class="header-text">[6] Text-to-Speech (TTS)</text>
    <line x1="865" y1="515" x2="1175" y2="515" stroke="#888888" stroke-width="1.2" stroke-linecap="round" />
    
    <text x="868" y="545" class="body-bold">• Sarvam AI Bulbul TTS Model</text>
    <text x="880" y="565" class="body-dim">Native Indian accent &amp; cadenced speech</text>
    <text x="868" y="595" class="body-bold">• Browser Web Speech Synthesis</text>
    <text x="880" y="615" class="body-dim">Zero-dependency client audio fallback</text>
    <text x="868" y="645" class="body-bold">• Audio Streaming to Browser</text>
    <text x="880" y="665" class="body-dim">Immediate playback in learner headphones</text>
  </g>

  <!-- 7. Database & CRM Layer -->
  <g id="box-7">
    <rect x="1230" y="135" width="330" height="585" rx="8" class="sketch-card" />
    <path d="M 1232 137 L 1558 134 L 1561 718 L 1229 721 Z" fill="none" stroke="#222" stroke-width="1.2" opacity="0.35"/>
    <text x="1248" y="168" class="header-text">[7] Database &amp; CRM Layer</text>
    <line x1="1245" y1="180" x2="1545" y2="180" stroke="#888888" stroke-width="1.2" stroke-linecap="round" />
    
    <text x="1248" y="210" class="body-bold">• SQLite / Supabase Store</text>
    <text x="1260" y="230" class="body-dim">Async database persistence</text>
    
    <text x="1248" y="265" class="body-bold">• Table: leads</text>
    <text x="1260" y="285" class="body-dim">Candidate name, phone, score, status</text>
    
    <text x="1248" y="320" class="body-bold">• Table: appointments</text>
    <text x="1260" y="340" class="body-dim">Confirmed 1-on-1 mentor demo bookings</text>
    
    <text x="1248" y="375" class="body-bold">• Table: calls &amp; call_events</text>
    <text x="1260" y="395" class="body-dim">Dialogue turns, speaker &amp; sentiment</text>
    
    <text x="1248" y="430" class="body-bold">• Live Caller Cockpit Sync</text>
    <text x="1260" y="450" class="body-dim">Side-by-side transcripts &amp; dialer cards</text>
    
    <text x="1248" y="490" class="body-bold">• Automated Lead Triage</text>
    <text x="1260" y="510" class="body-dim">Hot leads -> RM instant call</text>
    <text x="1260" y="530" class="body-dim">Warm leads -> WhatsApp brochure</text>
    <text x="1260" y="550" class="body-dim">Cold leads -> Re-engagement queue</text>
  </g>

